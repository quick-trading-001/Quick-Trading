<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - LIVE TRADE</title>
<style>
body{background:#070a14;color:white;font-family:Arial;padding:15px}
.box{background:#131827;padding:15px;border-radius:10px;max-width:400px;margin:auto;border:2px solid #00ff88}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:6px;border:none;font-size:14px}
button{width:100%;padding:12px;background:#00ff88;color:#000;border:none;border-radius:8px;font-weight:bold;font-size:14px;cursor:pointer;margin-top:10px}
#res{margin-top:15px;padding:10px;background:#000;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#00ff88">🔐 ADMIN PANEL</h2>
<p style="font-size:12px;text-align:center">Confirm LIVE TRADE Payments - Signals zitaenda DIRECT!</p>

<label style="font-size:11px">Namba ya Mteja (07XX):</label>
<input id="phone" type="tel" placeholder="07XXXXXXXX">

<label style="font-size:11px">Package Aliyonunua:</label>
<select id="pkg">
<option value="STARTER LIVE">STARTER LIVE - 80</option>
<option value="BASIC LIVE">BASIC LIVE - 150 (POPULAR)</option>
<option value="PRO LIVE">PRO LIVE - 200</option>
<option value="PREMIUM LIVE">PREMIUM LIVE - 500</option>
<option value="VIP PRO LIVE">VIP PRO LIVE - 1000</option>
</select>

<button onclick="confirmPay()">✅ CONFIRM - TUMA SIGNALS LIVE DIRECT</button>

<div id="res">Subiri mteja akituma pesa...</div>

<p style="font-size:10px;color:#aaa;margin-top:10px;text-align:center">Link hii ni siri yako tu! Usimpe mteja! <br> quick-trading.vercel.app/admin.html</p>
</div>

<script>
async function confirmPay(){
 let phone=document.getElementById('phone').value.trim();
 let pkg=document.getElementById('pkg').value;
 let resDiv=document.getElementById('res');
 
 if(!phone){ alert("Weka namba!"); return; }
 
 // Format 254
 let phone254 = phone.startsWith('0') ? phone : '0'+phone;
 
 resDiv.innerHTML="⏳ Inaconfirm...";
 
 try{
   // Hii ina-save kwa localStorage ya admin - na pia ina-try API
   let clients = JSON.parse(localStorage.getItem('paidClients')||'{}');
   clients[phone254+pkg] = {paid:true, phone:phone254, package:pkg, time:Date.now()};
   localStorage.setItem('paidClients', JSON.stringify(clients));
   
   // Jaribu API pia
   try{
     await fetch(`/api/check?phone=${phone254}&package=${pkg}&action=confirm`);
   }catch(e){}
   
   resDiv.innerHTML=`<b style="color:#00ff88">✅ SUCCESS!</b><br><br>📱 Namba: ${phone254}<br>📦 Package: ${pkg}<br><br>🔥 Mteja sasa ataona <b>LIVE SIGNALS DIRECT</b> kwa account yake!<br><br>Bot yake ya LIVE TRADE ime-active!`;
   
   // Tuma WhatsApp auto kwa mteja kumwambia
   let waLink = `https://wa.me/${phone254.replace('0','254')}?text=Hongera!%20${pkg}%20yako%20ya%20LIVE%20TRADE%20ime-active!%20Fungua%20quick-trading.vercel.app%20uone%20signals%20zako%20za%20LIVE%20DIRECT!%20🔥`;
   resDiv.innerHTML+=`<br><br><a href="${waLink}" target="_blank" style="display:block;background:#25D366;color:white;padding:8px;border-radius:6px;text-align:center;text-decoration:none;margin-top:10px">Tuma WhatsApp kwa Mteja</a>`;
   
 }catch(e){
   resDiv.innerHTML=`❌ Error: ${e.message}`;
 }
}
</script>
</body>
  </html>
